server:
  port: 8080

spring:
  application:
    name: traffic-sign-backend-test

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  model:
    onnx-path: classpath:model/traffic_sign_model.onnx
    mapping-path: classpath:model/class_mapping.json
